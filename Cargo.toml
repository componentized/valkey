[workspace]
resolver = "2"
members = [
    "components/as-keyvalue",
    "components/commands",
    "components/connection",
    "components/dep-cli",
    "components/resp",
    "components/sample-http-incrementor",
    "components/tcp",
    "components/tcp-connector",
    "crates/resp-codec",
    "crates/test-harness",
]

[workspace.package]
version = "0.3.0-dev"

[workspace.dependencies]
futures-channel = "0.3"
futures-core = "0.3"
resp-codec = { path = "./crates/resp-codec" }
test-harness = { path = "./crates/test-harness" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
wasmtime = { version = "49", features = ["component-model-async"] }
wasmtime-wasi = { version = "49", features = ["p3"] }
wit-bindgen = "0.61.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
