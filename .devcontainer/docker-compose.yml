name: componentized-valkey
services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/rust
    volumes:
    - ..:/workspaces/valkey
    - devcontainer-cargo-cache:/usr/local/cargo:volume
    - devcontainer-rustup-cache:/usr/local/rustup:volume
    command: sleep infinity
    network_mode: service:valkey
    depends_on:
    - valkey

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped

volumes:
  devcontainer-cargo-cache:
    external: true
    name: devcontainer-cargo-cache
  devcontainer-rustup-cache:
    external: true
    name: devcontainer-rustup-cache
